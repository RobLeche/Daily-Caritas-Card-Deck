<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>Daily Caritas Card · Jean Watson's Mandala Teachings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c29;
    --ink: #f6f3ff;
    --ink-soft: rgba(246, 243, 255, .72);
    --ink-faint: rgba(246, 243, 255, .5);
    --glass: rgba(255, 255, 255, .075);
    --glass-strong: rgba(255, 255, 255, .13);
    --edge: rgba(255, 255, 255, .2);
    --tint: 150, 130, 255;            /* replaced with the pulled card's colour */
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
  }
  [hidden] { display: none !important; }

  /* ── Ambient background ───────────────────────────── */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(160deg, #17123f 0%, #0f0c29 45%, #1a0f2e 100%); }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55;
    animation: drift 26s ease-in-out infinite alternate; transition: background 1.6s ease; }
  .aurora i:nth-child(1) { width: 62vmax; height: 62vmax; left: -18vmax; top: -22vmax;
    background: rgba(var(--tint), .75); }
  .aurora i:nth-child(2) { width: 48vmax; height: 48vmax; right: -16vmax; top: 22vh;
    background: rgba(236, 112, 178, .5); animation-duration: 32s; animation-delay: -8s; }
  .aurora i:nth-child(3) { width: 54vmax; height: 54vmax; left: 12vw; bottom: -30vmax;
    background: rgba(64, 188, 214, .45); animation-duration: 38s; animation-delay: -15s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); }
  }

  /* ── Shell ────────────────────────────────────────── */
  .app { position: relative; z-index: 1; width: 100%; max-width: 1040px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 32px; min-height: 100dvh;
    display: flex; flex-direction: column; }
  header { text-align: center; padding: 12px 0 22px; }
  .eyebrow { font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-faint);
    font-weight: 400; margin: 0 0 6px; }
  h1 { font-family: var(--display); font-weight: 500; font-size: clamp(1.9rem, 6vw, 2.7rem);
    line-height: 1.1; margin: 0; letter-spacing: .01em; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  .glass {
    background: linear-gradient(145deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--edge);
    border-radius: 28px;
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    backdrop-filter: blur(26px) saturate(160%);
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .22);
  }

  .stage { display: grid; gap: 24px; justify-items: center; align-items: center; }
  .stage.revealed { align-items: start; }

  /* ── The card ─────────────────────────────────────── */
  .card-col { width: 100%; display: grid; justify-items: center; gap: 22px; }
  .card { position: relative; width: min(74vw, 320px); aspect-ratio: 5 / 7; perspective: 1400px;
    border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer;
    transition: width .5s var(--ease), aspect-ratio .5s var(--ease); -webkit-tap-highlight-color: transparent; }
  .card.landscape { width: min(88vw, 430px); }
  .card:disabled { cursor: default; }
  .card:focus-visible { outline: none; }
  .card:focus-visible .card-inner { box-shadow: 0 0 0 3px rgba(255, 255, 255, .7); }
  .card::before, .card::after {     /* the rest of the deck, peeking out behind */
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: transform .7s var(--ease), opacity .5s ease; }
  .card::before { transform: rotate(-6deg) translate(-10px, 6px); }
  .card::after  { transform: rotate(5deg) translate(10px, 4px); }
  .revealed .card::before, .revealed .card::after { opacity: 0; transform: none; }
  .card-inner { position: absolute; inset: 0; z-index: 1; border-radius: 22px; transform-style: preserve-3d;
    transition: transform 1.1s var(--ease); animation: float 6s ease-in-out infinite; }
  .revealed .card-inner { transform: rotateY(180deg); animation: none; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .face { position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .back { display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .22), transparent 58%),
      linear-gradient(150deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .05));
    border: 1px solid rgba(255, 255, 255, .32);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: 0 30px 60px -22px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .back svg { width: 68%; height: auto; opacity: .9; animation: turn 80s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .back::after { content: ""; position: absolute; inset: 10px; border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, .22); }
  .front { transform: rotateY(180deg); background: #1b173f;
    box-shadow: 0 30px 70px -20px rgba(var(--tint), .55), 0 20px 50px -24px rgba(0, 0, 0, .7); }
  .front img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ── Invitation (before the pull) ─────────────────── */
  .invite { text-align: center; max-width: 420px; padding: 26px 26px 28px; }
  .invite p { margin: 0 0 20px; font-family: var(--display); font-style: italic; font-size: 1.22rem;
    line-height: 1.45; color: var(--ink-soft); }
  .btn { appearance: none; border: 1px solid rgba(255, 255, 255, .38); cursor: pointer;
    font: 500 .95rem var(--body); letter-spacing: .06em; color: var(--ink);
    padding: 15px 30px; border-radius: 999px; min-height: 50px;
    background: linear-gradient(135deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, .1));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 12px 30px -10px rgba(var(--tint), .7), inset 0 1px 0 rgba(255, 255, 255, .45);
    transition: transform .25s var(--ease), background .25s ease; }
  .btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, rgba(255, 255, 255, .4), rgba(255, 255, 255, .16)); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:focus-visible { outline: 3px solid rgba(255, 255, 255, .75); outline-offset: 3px; }

  /* ── Countdown ────────────────────────────────────── */
  .timer { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; font-size: .86rem; color: var(--ink-soft); }
  .timer b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--tint));
    box-shadow: 0 0 12px 2px rgba(var(--tint), .9); flex: none; }

  /* ── The reading ──────────────────────────────────── */
  .reading { width: 100%; max-width: 560px; padding: 30px 26px 26px;
    animation: rise .9s var(--ease) .55s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .reading .eyebrow { margin-bottom: 8px; }
  .reading h2 { font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 7vw, 2.8rem);
    line-height: 1.08; margin: 0 0 4px; overflow-wrap: anywhere; }
  .alias { margin: 0 0 6px; font-size: .86rem; color: var(--ink-faint); letter-spacing: .04em; }
  .theme { margin: 14px 0 0; padding-left: 14px; border-left: 2px solid rgba(var(--tint), .9);
    font-size: .92rem; font-weight: 400; letter-spacing: .05em; color: var(--ink-soft); line-height: 1.6; }
  .theme span { display: block; }
  .brief { font-family: var(--display); font-size: 1.28rem; line-height: 1.5; margin: 20px 0 22px; }
  details { border-radius: 18px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .13);
    margin-top: 10px; overflow: hidden; }
  summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    padding: 15px 18px; min-height: 52px; font-weight: 500; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 1.3rem; font-weight: 300; line-height: 1; transition: transform .3s var(--ease); }
  details[open] summary::after { transform: rotate(45deg); }
  summary:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: -2px; border-radius: 18px; }
  .prose { padding: 0 18px 8px; color: var(--ink-soft); font-size: .98rem; }
  .prose p { margin: 0 0 14px; }

  footer { text-align: center; padding: 30px 0 4px; font-size: .74rem; color: var(--ink-faint); letter-spacing: .03em; }
  footer button { background: none; border: 0; padding: 8px; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }

  @media (min-width: 900px) {
    .stage.revealed { grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 56px; justify-items: stretch; }
    .stage.revealed .card-col { position: sticky; top: 32px; }
    .stage.revealed .card { width: min(100%, 340px); }
    .stage.revealed .card.landscape { width: 100%; }
    .reading { padding: 38px 38px 32px; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <header>
    <p class="eyebrow">Jean Watson's Mandala Teachings</p>
    <h1>Daily Caritas Card</h1>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="card-col">
        <button class="card" id="card" type="button" aria-label="Pull today's card">
          <span class="card-inner">
            <span class="face back">
              <svg viewBox="-100 -100 200 200" fill="none" stroke="#fff" aria-hidden="true" id="mandala"></svg>
            </span>
            <span class="face front"><img id="cardImg" alt="" decoding="async"></span>
          </span>
        </button>

        <div class="timer glass" id="timer" hidden>
          <span class="dot"></span>
          <span id="timerText">Your next card arrives in <b id="countdown">24:00:00</b></span>
        </div>
        <button class="btn" id="newBtn" type="button" hidden>Pull a new card</button>
      </div>

      <section class="invite glass" id="invite">
        <p>Breathe into your sacred heart. Open to receive a card, knowing the one you receive is a lesson for you.</p>
        <button class="btn" id="pullBtn" type="button">Pull today's card</button>
      </section>

      <article class="reading glass" id="reading" hidden aria-live="polite">
        <p class="eyebrow" id="rNum"></p>
        <h2 id="rName"></h2>
        <p class="alias" id="rAlias" hidden></p>
        <div class="theme" id="rTheme"></div>
        <p class="brief" id="rBrief"></p>
        <details id="dTeach"><summary>The Teaching</summary><div class="prose" id="rTeach"></div></details>
        <details id="dRitual"><summary>Sacred Ritual</summary><div class="prose" id="rRitual"></div></details>
      </article>
    </div>
  </main>

  <footer>
    Teachings &amp; mandala art © Jean Watson · Watson Caring Science
    <br><button type="button" id="resetBtn">Testing only: reset the 24-hour timer</button>
  </footer>
</div>

<script src="cards-data.js"></script>
<script>
(function () {
  "use strict";
  var DAY = 24 * 60 * 60 * 1000;
  var KEY = "caritas-daily-card-v1";
  var CARDS = window.CARDS || [];
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), cardEl = $("card"), img = $("cardImg");
  var tick = null;

  // ── Saved state: { current: {id, at}, seen: [ids] } ──
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* private mode: still works for this visit */ }
  }
  var state = load();
  if (!Array.isArray(state.seen)) state.seen = [];

  function byId(id) { return CARDS.filter(function (c) { return c.id === id; })[0]; }

  // Draw at random from cards not yet received; once all 54 have come up, start over.
  function draw() {
    var pool = CARDS.filter(function (c) { return state.seen.indexOf(c.id) === -1; });
    if (!pool.length) { state.seen = []; pool = CARDS.slice(); }
    var r = window.crypto && crypto.getRandomValues
      ? crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 : Math.random();
    return pool[Math.floor(r * pool.length)];
  }

  function paras(el, list) {
    el.textContent = "";
    list.forEach(function (t) { var p = document.createElement("p"); p.textContent = t; el.appendChild(p); });
  }

  function fill(card) {
    document.documentElement.style.setProperty("--tint", card.rgb);
    cardEl.classList.toggle("landscape", card.w > card.h);
    cardEl.style.aspectRatio = card.w + " / " + card.h;
    img.alt = card.name + " mandala card";
    $("rNum").textContent = "Today's card · No. " + card.num;
    $("rName").textContent = card.name;
    var alias = $("rAlias");
    alias.hidden = card.guide.toLowerCase().replace(/[^a-z]/g, "") === card.name.toLowerCase().replace(/[^a-z]/g, "");
    alias.textContent = "Guidebook: " + card.guide;
    var theme = $("rTheme");
    theme.textContent = "";
    theme.hidden = !card.theme.length;
    card.theme.forEach(function (t) { var s = document.createElement("span"); s.textContent = t; theme.appendChild(s); });
    $("rBrief").textContent = card.brief;
    paras($("rTeach"), card.teaching);
    paras($("rRitual"), card.ritual);
    $("dTeach").open = false; $("dRitual").open = false;
  }

  function reveal(card) {
    fill(card);
    var show = function () {
      stage.classList.add("revealed");
      cardEl.disabled = true;
      cardEl.setAttribute("aria-label", card.name + " — today's card");
      $("invite").hidden = true;
      $("reading").hidden = false;
      $("timer").hidden = false;
      startCountdown();
    };
    img.onload = img.onerror = show;
    img.src = card.img;
    if (img.complete && img.naturalWidth) { img.onload = null; show(); }
  }

  function ready() {
    clearInterval(tick);
    stage.classList.remove("revealed");
    cardEl.disabled = false;
    cardEl.classList.remove("landscape");
    cardEl.style.aspectRatio = "";
    cardEl.setAttribute("aria-label", "Pull today's card");
    document.documentElement.style.removeProperty("--tint");
    $("invite").hidden = false;
    $("reading").hidden = true;
    $("timer").hidden = true;
    $("newBtn").hidden = true;
  }

  function pull() {
    if (state.current && Date.now() - state.current.at < DAY) return;   // one card per 24 hours
    var card = draw();
    if (!card) return;
    state.current = { id: card.id, at: Date.now() };
    state.seen.push(card.id);
    save(state);
    reveal(card);
  }

  function two(n) { return (n < 10 ? "0" : "") + n; }
  function startCountdown() {
    clearInterval(tick);
    var update = function () {
      var left = state.current.at + DAY - Date.now();
      if (left <= 0) {
        clearInterval(tick);
        $("timerText").textContent = "A new card is waiting for you";
        $("newBtn").hidden = false;
        return;
      }
      var s = Math.floor(left / 1000);
      $("timerText").innerHTML = 'Your next card arrives in <b id="countdown"></b>';
      $("countdown").textContent = two(Math.floor(s / 3600)) + ":" + two(Math.floor(s % 3600 / 60)) + ":" + two(s % 60);
    };
    update();
    tick = setInterval(update, 1000);
  }

  // Card-back mandala: rings of dots, echoing the deck's artwork.
  (function () {
    var svg = $("mandala"), ns = "http://www.w3.org/2000/svg", html = "";
    [[16, 8, 2.2], [32, 14, 2], [48, 22, 1.8], [64, 30, 1.6], [80, 40, 1.4]].forEach(function (ring) {
      for (var i = 0; i < ring[1]; i++) {
        var a = i / ring[1] * Math.PI * 2;
        html += '<circle cx="' + (Math.cos(a) * ring[0]).toFixed(2) + '" cy="' + (Math.sin(a) * ring[0]).toFixed(2) +
                '" r="' + ring[2] + '" fill="#fff" stroke="none" opacity="' + (1 - ring[0] / 130).toFixed(2) + '"/>';
      }
    });
    html += '<circle r="6" fill="#fff" stroke="none"/><circle r="92" stroke-opacity=".45" stroke-width=".8"/><circle r="24" stroke-opacity=".3" stroke-width=".6"/>';
    svg.innerHTML = html;
  })();

  $("pullBtn").addEventListener("click", pull);
  cardEl.addEventListener("click", pull);
  $("newBtn").addEventListener("click", function () { ready(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  $("resetBtn").addEventListener("click", function () {     // remove this button (and its footer line) before launch
    delete state.current; save(state); ready();
  });

  // On open: show today's card if one was pulled in the last 24 hours, otherwise invite a pull.
  var current = state.current && byId(state.current.id);
  if (current && Date.now() - state.current.at < DAY) reveal(current); else ready();
})();
</script>
</body>
</html>
